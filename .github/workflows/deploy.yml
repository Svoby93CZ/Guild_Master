# Postaví hru a vystaví ji na GitHub Pages.
#
# Jednorázově je potřeba v repozitáři zapnout Settings → Pages → Source:
# "GitHub Actions". Pak se hra nasadí při každém pushi do main a jde ji
# pustit také ručně tlačítkem "Run workflow".
name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžná nasazení se nepřerušují, aby se rozestavěné nikdy nevystavilo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Pages hostuje repozitář v podadresáři /<název-repozitáře>/.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
